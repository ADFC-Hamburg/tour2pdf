<html>
    <body>
        <H1>ADFC tour2pdf Kurzanleitung</H1>
        <p>
        Um eine neue PDF Datei zu erzeugen, bitte diese Formular ausfüllen:
        </p><p>
        <form action="/api/pdf" method="get">
            <input type="date" id="beginning" name="beginning"/>
            <input type="date" id="end" name="end"/>
            <input type="hidden" name="unitKey" value="158">
            <input type="hidden" name="eventType" value="Radtour">
            Maximale Anzahl an Touren: <input type="text" name="limit" value="30">
            <input type="submit">
        </form>
        <script>
            function toDateInputValue(dateObject){
                const local = new Date(dateObject);
                local.setMinutes(dateObject.getMinutes() - dateObject.getTimezoneOffset());
                return local.toJSON().slice(0,10);
            };
            document.getElementById('beginning').value = toDateInputValue(new Date());
            var end = new Date();
            end.setDate(end.getDate() + 30);
            document.getElementById('end').value = toDateInputValue(end);
        </script>
        </p>
        <p>Oder:</p>
        <p>1. Gehe auf <a href="https://touren-termine.adfc.de" target="_blank">https://touren-termine.adfc.de</a> und mache eine gute Suche.</p>

        <p>2. Füge die URL hier ein:</p>

        <form id="urlForm">
            <input type="text" id="tourUrl" placeholder="https://touren-termine.adfc.de/suche?..." style="width: 100%; margin-bottom: 10px;">
            <button type="button" onclick="generateUrl('pdf')">PDF erzeugen</button>
            <button type="button" onclick="generateUrl('html')">HTML erzeugen</button>
        </form>

        <script>
            function generateUrl(type) {
                const inputUrl = document.getElementById('tourUrl').value;
                if (!inputUrl.startsWith('https://touren-termine.adfc.de/suche?')) {
                    alert('Bitte eine gültige URL von https://touren-termine.adfc.de/suche? einfügen.');
                    return;
                }
                const apiUrl = inputUrl.replace('https://touren-termine.adfc.de/suche?', `/api/${type}?`);
                window.open(apiUrl, '_blank');
            }
        </script>
    </body>
</html>
